
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

<style>
*{
    margin:0;
}

body{
    background-color: antiquewhite;
}

.navbar{
    background-color: rgb(174, 89, 89);
    display:flex;
    align-items:center;
    padding:0;
}

.nav-links{
    margin-left:auto;
}

.navbar a{
    padding:5px;
    margin:2px;
    color:black;
    text-decoration:none;
}

.login-container{
    max-width:450px;
    margin:50px auto;
}

.card{
    border:1px solid black;
    border-radius:10px;
}

.login-btn{
    background-color:rgb(174, 89, 89);
    color:white;
    border:none;
    width:100%;
    padding:10px;
    border-radius:5px;
}

.login-btn:hover{
    background-color:rgb(145, 70, 70);
}

.footer{
    background-color:rgb(174, 89, 89);
    text-align:center;
    padding:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="navbar">
    <img src="https://previews.123rf.com/images/mamun25g/mamun25g2201/mamun25g220114204/181613683-vbj-circle-letter-logo-design-with-circle-and-ellipse-shape-vbj-ellipse-letters-with-typographic.jpg"
         height="100" width="100">

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="About.html">About</a>
        <a href="Courses.html">Courses</a>
        <a href="Contact.html">Contact</a>
        <a href="Login.html">Login</a>
    </div>
</div>

<div class="container">
    <div class="login-container">

        <div class="card p-4 shadow-sm">

            <h2 class="text-center mb-4">Login</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Enter Password"
                           required>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <div class="text-center mt-3">
                <p>
                    Haven't registered yet?
                    <a href="reg.html">Register Here</a>
                </p>
            </div>

        </div>

    </div>
</div>



</body>
</html>
