<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

<style>
*{
    margin:0;
}

body{
    background-color: antiquewhite;
}

.navbar{
    background-color: rgb(174, 89, 89);
    display: flex;
    align-items: center;
    padding: 0;
}

a{
    padding:5px;
    margin:2px;
    color:black;
    text-decoration:none;
}

.nav-links{
    margin-left:auto;
}

.banner{
    width:100%;
    height:300px;
    background-image:url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    color:white;
}

.banner::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.4);
}

.banner-text{
    position:relative;
    z-index:1;
    text-align:center;
}

.contact-section{
    padding:40px 20px;
}

.card{
    border:1px solid black;
}

.footer{
    background-color: rgb(174, 89, 89);
    text-align:center;
    color:black;
    padding:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="navbar">
    <img src="https://previews.123rf.com/images/mamun25g/mamun25g2201/mamun25g220114204/181613683-vbj-circle-letter-logo-design-with-circle-and-ellipse-shape-vbj-ellipse-letters-with-typographic.jpg"
         height="100" width="100">

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="About.html">About</a>
        <a href="Courses.html">Courses</a>
        <a href="Contact.html">Contact</a>
        <a href="Login.html">Login</a>
    </div>
</div>

<div class="banner">
    <div class="banner-text">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you!</p>
    </div>
</div>

<div class="container contact-section">

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h3 class="mb-3">Send Us a Message</h3>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" placeholder="Enter subject">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark">
                        Send Message
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-6">

            <div class="card p-4 shadow-sm mb-4">
                <h3>Address Information</h3>

                <p><strong>SereneSols</strong></p>

               

                <p><strong>Email:</strong> info@serenesols.in</p>
                <p><strong>Phone:</strong> +91 9867629737</p>
            </div>

            <div class="card p-4 shadow-sm">
                <h3 class="mb-3">Location Map</h3>

                <iframe
                    src="https://maps.google.com/maps?q=CVR%20College%20of%20Engineering&t=&z=13&ie=UTF8&iwloc=&output=embed"
                    width="100%"
                    height="250"
                    style="border:0;"
                    loading="lazy">
                </iframe>

            </div>

        </div>

    </div>

</div>

<footer class="footer">
    <p>&copy; SereneSols. All Rights Reserved.</p>
</footer>

</body>
</html>
